openapi: 3.1.0
info:
  title: Contrat d'interface NoCode / Tech Lead · Bières des Régions Auvergne-Rhône-Alpes
  version: 0.2.0
  description: |
    Brouillon. Version co-signée attendue au jalon J3.
    Flux : référentiel contractuel (NoCode → Tech Lead), stocks et consommation,
    livraisons (Tech Lead → NoCode), webhook de nouveau tarif (NoCode → Tech Lead).
servers:
  - url: http://127.0.0.1:4010
    description: Mock (Prism)
  - url: https://plghltdifavegrxdeons.supabase.co/functions/v1
    description: API réelle NoCode (référentiel)
  - url: https://A-DEFINIR.cloudfunctions.net/api/v1
    description: API réelle Tech Lead (stocks, livraisons)
security:
  - apiKey: []
tags:
  - name: Référentiel contractuel
    description: Produit par NoCode (Supabase), consommé par Tech Lead
  - name: Stocks et consommation
    description: Produit par Tech Lead (Firebase), consommé par NoCode
  - name: Livraisons
    description: Produit par Tech Lead (Firebase), consommé par NoCode
paths:
  /suppliers:
    get:
      operationId: listSuppliers
      tags: [Référentiel contractuel]
      summary: Liste des fournisseurs retenus
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Supplier' } }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /tariffs:
    get:
      operationId: listTariffs
      tags: [Référentiel contractuel]
      summary: Tarifs négociés en vigueur (uniquement issus d'un contrat signé)
      parameters:
        - in: query
          name: supplierId
          schema: { type: string }
        - in: query
          name: effectiveDate
          description: Date à laquelle le tarif doit être en vigueur (défaut aujourd'hui)
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Tariff' } }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /stocks:
    get:
      operationId: listStocks
      tags: [Stocks et consommation]
      summary: Niveaux de stock par article, par brasserie et consolidés réseau
      parameters:
        - in: query
          name: breweryId
          description: Absent = consolidé à l'échelle du réseau
          schema: { type: string }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/StockLevel' } }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /consumptions:
    get:
      operationId: listConsumptions
      tags: [Stocks et consommation]
      summary: Consommation par article et par période
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string, format: date }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date }
        - in: query
          name: granularity
          schema: { type: string, enum: [day, week, month], default: month }
        - in: query
          name: breweryId
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Consumption' } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /deliveries/reliability:
    get:
      operationId: deliveryReliability
      tags: [Livraisons]
      summary: Retards et conformité des livraisons par fournisseur
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/SupplierReliability' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
webhooks:
  newTariff:
    post:
      operationId: receiveNewTariff
      summary: Émis par NoCode à chaque nouveau tarif en vigueur (émission optionnelle, Tech Lead relit aussi /tariffs périodiquement)
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Tariff' }
      responses:
        '204': { description: Reçu }
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Une clé par équipe, stockée hors du code et des configurations partagées.
  parameters:
    page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
  responses:
    Unauthorized:
      description: Clé absente ou invalide
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidRequest:
      description: Paramètres invalides
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: PARAMETRE_INVALIDE }
        message: { type: string }
        details: { type: object }
    Pagination:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
    Supplier:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        categories: { type: array, items: { type: string }, example: [malt, houblon] }
        paymentTerms: { type: string, example: "30 jours fin de mois" }
    Tariff:
      type: object
      required: [id, supplierId, articleId, unitPriceExclTax, unit, effectiveDate]
      properties:
        id: { type: string }
        supplierId: { type: string }
        articleId: { type: string }
        articleLabel: { type: string, example: "Malt Pilsen 25 kg" }
        unitPriceExclTax: { type: number, example: 28.5 }
        unit: { type: string, example: sac }
        minimumOrder: { type: number, example: 40 }
        tiers:
          type: array
          items:
            type: object
            properties:
              fromQuantity: { type: number }
              unitPriceExclTax: { type: number }
        deliveryLeadTimeDays: { type: integer, example: 5 }
        effectiveDate: { type: string, format: date }
        endDate: { type: [string, "null"], format: date }
        contractId: { type: string }
    StockLevel:
      type: object
      properties:
        breweryId: { type: [string, "null"] }
        articleId: { type: string }
        quantity: { type: number }
        unit: { type: string }
        minimumThreshold: { type: number }
        updatedAt: { type: string, format: date-time }
    Consumption:
      type: object
      properties:
        breweryId: { type: [string, "null"] }
        articleId: { type: string }
        period: { type: string, example: "2026-09" }
        quantity: { type: number }
        unit: { type: string }
    SupplierReliability:
      type: object
      properties:
        supplierId: { type: string }
        deliveryCount: { type: integer }
        delayRate: { type: number, example: 0.12 }
        averageDelayDays: { type: number }
        conformityRate: { type: number, example: 0.95 }
